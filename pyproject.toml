[project]
name = "myagent"
version = "0.1.0"
description = "跟练 Hello-Agents 教程（第 7 章起）并以现代写法重构的智能体框架"
readme = "README.md"
authors = [
    { name = "Loker", email = "loker_2024@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "examples"]
# reference/ 是教程只读快照，禁止被格式化或 lint（其代码本身即"过时写法"样本）
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3：中文 docstring 与注释必然出现全角标点，按约定不视为歧义字符
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
# tests/ 与 examples/ 有内容后并入：uv run mypy src tests examples
files = ["src"]
exclude = ["^reference/"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
